[package]
name = "yt-music-downloader"
version = "0.3.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
directories = "6.0.0"
indicatif = "0.18.4"
reqwest = { version = "0.13.2", features = ["stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysuri = "0.4.0"
tokio = { version = "1.50.0", features = ["full"] }
zip = "8.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1.31"
